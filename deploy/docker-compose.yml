# Math Arena - Docker Compose Dev Environment
# Usage: docker compose -f deploy/docker-compose.yml up -d

services:
  # ==================== Infrastructure ====================

  postgres:
    image: pgvector/pgvector:pg15
    container_name: math-arena-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: math_arena
    ports:
      - "54329:5432"
    volumes:
      - math-arena-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: math-arena-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO：文件上传/解析产物的 S3 兼容存储（迭代06 补：此前无存储服务，files 全链路灯红）
  minio:
    image: minio/minio:latest
    container_name: math-arena-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Application Services ====================

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: math-arena-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/math_arena
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=${APP_ENV:-development}
      - AUTH_SMS_PROVIDER=${AUTH_SMS_PROVIDER:-demo}
      - AUTH_DEMO_SMS_ALLOWLIST=${AUTH_DEMO_SMS_ALLOWLIST:-13800000000}
      - AUTH_ACCESS_TOKEN_MINUTES=${AUTH_ACCESS_TOKEN_MINUTES:-15}
      - AUTH_STANDARD_ABSOLUTE_HOURS=${AUTH_STANDARD_ABSOLUTE_HOURS:-168}
      - AUTH_STANDARD_IDLE_MINUTES=${AUTH_STANDARD_IDLE_MINUTES:-1440}
      - AUTH_REMEMBER_ABSOLUTE_HOURS=${AUTH_REMEMBER_ABSOLUTE_HOURS:-720}
      - AUTH_REMEMBER_IDLE_MINUTES=${AUTH_REMEMBER_IDLE_MINUTES:-10080}
      - AUTH_ADMIN_ABSOLUTE_HOURS=${AUTH_ADMIN_ABSOLUTE_HOURS:-12}
      - AUTH_ADMIN_IDLE_MINUTES=${AUTH_ADMIN_IDLE_MINUTES:-30}
      - AUTH_TRUSTED_PROXIES=${AUTH_TRUSTED_PROXIES:-}
      - AUTH_CAPTCHA_PROVIDER=${AUTH_CAPTCHA_PROVIDER:-disabled}
      - AUTH_BREAK_GLASS_ENABLED=false
      - AUTH_TRUSTED_OPERATIONS_ENV=false
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  math-arena-dev-pgdata:
    external: true
  redisdata:
  miniodata:
