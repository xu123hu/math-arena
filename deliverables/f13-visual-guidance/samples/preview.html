function card(p) {
  const el = document.createElement('div')
  el.className = 'card'
  const stage = document.createElement('div')
  stage.className = 'stage'
  const dots = document.createElement('div')
  dots.className = 'dots'
  const label = document.createElement('span')
  label.className = 'label'
  const replay = document.createElement('button')
  replay.className = 'replay'
  replay.textContent = '⟳ 重播'
  const controls = document.createElement('div')
  controls.className = 'controls'
  controls.append(dots, label, replay)
  el.innerHTML = '<h2>' + p.title + '</h2><div class="caption">' + p.caption + '</div>'
  el.append(stage, controls)

  let idx = 0
  let timer = null
  const imgs = p.frames.map((svg, i) => {
    const wrap = document.createElement('div')
    wrap.style.display = 'none'
    wrap.innerHTML = svg
    stage.append(wrap)
    const dot = document.createElement('button')
    dot.className = 'dot'
    dot.title = p.labels[i]
    dot.onclick = () => jump(i)
    dots.append(dot)
    return wrap
  })
  function show(i) {
    idx = i
    imgs.forEach((w, j) => { w.style.display = j === i ? 'block' : 'none' })
    dots.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('on', j === i))
    label.textContent = p.labels[i]
  }
  function jump(i) { clearTimeout(timer); show(i) }
  function step() {
    if (idx < imgs.length - 1) { show(idx + 1); timer = setTimeout(step, 1600) }
  }
  function play() { clearTimeout(timer); show(0); timer = setTimeout(step, 1600) }
  replay.onclick = play
  play()
  return el
}

const root = document.getElementById('root')
PROBLEMS.forEach((p) => root.append(card(p)))
